name: tutor_schedule
description: 家庭教师日程管理 App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 状态管理
  flutter_riverpod: ^2.6.1
  # 数据库
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  sqlite3_web: ^0.1.0
  path_provider: ^2.1.5
  path: ^1.9.1
  # 路由
  go_router: ^14.8.1
  # UI
  fl_chart: ^0.70.2
  flutter_slidable: ^3.1.1
  intl: ^0.20.2
  # 通知
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  # 导出
  csv: ^6.0.0
  excel: ^4.0.6
  # 工具
  uuid: ^4.5.1
  share_plus: ^10.1.4
  device_calendar: ^4.3.2
  file_picker: ^8.1.7
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.2

flutter:
  uses-material-design: true
dependency_overrides:
  timezone: ^0.10.0
